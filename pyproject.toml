[project]
name = "meview-3d-qa-viewer"
version = "0.1.0"
description = "MEVIEW dense-mesh dataset audit and 3D QA viewer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pyvista>=0.48.4",
    "pyvistaqt>=0.13.0",
    "pyside6>=6.11.2",
    "torch>=2.14.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meviewer"]
[project.scripts]
meviewer = "meviewer.cli.main:main"

[project.optional-dependencies]
landmarks = ["mediapipe==0.10.21"]
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "prek>=0.5.2,<0.6",
    "ruff>=0.15.15,<0.16",
]
